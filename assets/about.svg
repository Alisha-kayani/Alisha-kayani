<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610">
<defs>
<linearGradient id="gab" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6"/><stop offset=".55" stop-color="#0EA5E9"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
<linearGradient id="bgab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121C31"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
<linearGradient id="bdab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6" stop-opacity=".55"/><stop offset=".5" stop-color="#22304D"/><stop offset="1" stop-color="#F59E0B" stop-opacity=".45"/></linearGradient>
<radialGradient id="gaab" cx=".12" cy=".05" r=".55"><stop offset="0" stop-color="#14B8A6" stop-opacity=".22"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
<radialGradient id="gbab" cx=".95" cy="1" r=".6"><stop offset="0" stop-color="#F59E0B" stop-opacity=".14"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
<pattern id="dotab" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/></pattern>
<clipPath id="clab"><rect width="1600" height="610" rx="28"/></clipPath>
<style>
.t{font-family:'Segoe UI', -apple-system, 'Helvetica Neue', Ubuntu, Arial, sans-serif} .m{font-family:'Cascadia Code', 'Fira Code', Consolas, monospace}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.a{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}} .p{animation:pulse 2.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,18px)}} .d{animation:drift 12s ease-in-out infinite}
</style>
</defs>
<g clip-path="url(#clab)">
<rect width="1600" height="610" fill="url(#bgab)"/>
<rect width="1600" height="610" fill="url(#dotab)"/>
<rect width="1600" height="610" fill="url(#gaab)" class="d"/><rect width="1600" height="610" fill="url(#gbab)"/>
</g>
<rect x="1.5" y="1.5" width="1597" height="607" rx="28" fill="none" stroke="url(#bdab)" stroke-width="2"/>
<g class="a"><text x="60" y="84" text-anchor="start" class="t" font-size="25" font-weight="400" fill="#CBD5E1">I&#x27;m a Backend Software Engineer and Agentic AI Developer. At Postsiva I build the FastAPI core behind a</text><text x="60" y="123" text-anchor="start" class="t" font-size="25" font-weight="400" fill="#CBD5E1">unified social media OS (automation, scheduling, AI workflows and analytics) and lead social growth. I</text><text x="60" y="162" text-anchor="start" class="t" font-size="25" font-weight="400" fill="#CBD5E1">also teach Computer Science part-time at CISD, Islamabad.</text></g><g class="a" style="animation-delay:0.15s"><rect x="60.0" y="226.25" width="475" height="334" rx="22" fill="#0E1729" stroke="#14B8A6" stroke-opacity=".35" stroke-width="1.5"/><rect x="60.0" y="226.25" width="475" height="5" rx="2.5" fill="#14B8A6"/><text x="88.0" y="284.25" class="m" font-size="22" font-weight="700" fill="#14B8A6">01</text><text x="132.0" y="284.25" class="t" font-size="29" font-weight="800" fill="#F1F5F9">Agentic AI</text><text x="88.0" y="328" text-anchor="start" class="t" font-size="20" font-weight="400" fill="#CBD5E1">Agents that reason, plan and execute:</text><text x="88.0" y="358" text-anchor="start" class="t" font-size="20" font-weight="400" fill="#CBD5E1">WhatsApp ordering bots, RAG pipelines,</text><text x="88.0" y="388" text-anchor="start" class="t" font-size="20" font-weight="400" fill="#CBD5E1">content workflows.</text><rect x="88.0" y="460.0" width="172" height="32" rx="16.0" fill="#14B8A6" fill-opacity="0.1" stroke="#14B8A6" stroke-opacity=".40"/><text x="103.0" y="481.6" class="t" font-size="16" font-weight="600" fill="#14B8A6">OpenAI Agents SDK</text><rect x="268.4" y="460.0" width="84" height="32" rx="16.0" fill="#14B8A6" fill-opacity="0.1" stroke="#14B8A6" stroke-opacity=".40"/><text x="283.4" y="481.6" class="t" font-size="16" font-weight="600" fill="#14B8A6">CrewAI</text><rect x="360.15999999999997" y="460.0" width="106" height="32" rx="16.0" fill="#14B8A6" fill-opacity="0.1" stroke="#14B8A6" stroke-opacity=".40"/><text x="375.15999999999997" y="481.6" class="t" font-size="16" font-weight="600" fill="#14B8A6">LangChain</text><rect x="88.0" y="504.0" width="60" height="32" rx="16.0" fill="#14B8A6" fill-opacity="0.1" stroke="#14B8A6" stroke-opacity=".40"/><text x="103.0" y="525.6" class="t" font-size="16" font-weight="600" fill="#14B8A6">MCP</text></g><g class="a" style="animation-delay:0.27s"><rect x="562.6666666666667" y="226.25" width="475" height="334" rx="22" fill="#0E1729" stroke="#0EA5E9" stroke-opacity=".35" stroke-width="1.5"/><rect x="562.6666666666667" y="226.25" width="475" height="5" rx="2.5" fill="#0EA5E9"/><text x="590.6666666666667" y="284.25" class="m" font-size="22" font-weight="700" fill="#0EA5E9">02</text><text x="634.6666666666667" y="284.25" class="t" font-size="29" font-weight="800" fill="#F1F5F9">Backend Engineering</text><text x="590.6666666666667" y="328" text-anchor="start" class="t" font-size="20" font-weight="400" fill="#CBD5E1">Production FastAPI services for scheduling,</text><text x="590.6666666666667" y="358" text-anchor="start" class="t" font-size="20" font-weight="400" fill="#CBD5E1">analytics and integrations that hold up</text><text x="590.6666666666667" y="388" text-anchor="start" class="t" font-size="20" font-weight="400" fill="#CBD5E1">under real traffic.</text><rect x="590.6666666666667" y="460.0" width="94" height="32" rx="16.0" fill="#0EA5E9" fill-opacity="0.1" stroke="#0EA5E9" stroke-opacity=".40"/><text x="605.6666666666667" y="481.6" class="t" font-size="16" font-weight="600" fill="#0EA5E9">FastAPI</text><rect x="692.3466666666668" y="460.0" width="72" height="32" rx="16.0" fill="#0EA5E9" fill-opacity="0.1" stroke="#0EA5E9" stroke-opacity=".40"/><text x="707.3466666666668" y="481.6" class="t" font-size="16" font-weight="600" fill="#0EA5E9">Redis</text><rect x="772.2666666666668" y="460.0" width="78" height="32" rx="16.0" fill="#0EA5E9" fill-opacity="0.1" stroke="#0EA5E9" stroke-opacity=".40"/><text x="787.2666666666668" y="481.6" class="t" font-size="16" font-weight="600" fill="#0EA5E9">MySQL</text><rect x="857.9466666666667" y="460.0" width="112" height="32" rx="16.0" fill="#0EA5E9" fill-opacity="0.1" stroke="#0EA5E9" stroke-opacity=".40"/><text x="872.9466666666667" y="481.6" class="t" font-size="16" font-weight="600" fill="#0EA5E9">OAuth/JWT</text></g><g class="a" style="animation-delay:0.39s"><rect x="1065.3333333333335" y="226.25" width="475" height="334" rx="22" fill="#0E1729" stroke="#F59E0B" stroke-opacity=".35" stroke-width="1.5"/><rect x="1065.3333333333335" y="226.25" width="475" height="5" rx="2.5" fill="#F59E0B"/><text x="1093.3333333333335" y="284.25" class="m" font-size="22" font-weight="700" fill="#F59E0B">03</text><text x="1137.3333333333335" y="284.25" class="t" font-size="29" font-weight="800" fill="#F1F5F9">Full-Stack Delivery</text><text x="1093.3333333333335" y="328" text-anchor="start" class="t" font-size="20" font-weight="400" fill="#CBD5E1">From idea to a live product people can</text><text x="1093.3333333333335" y="358" text-anchor="start" class="t" font-size="20" font-weight="400" fill="#CBD5E1">click, with Next.js frontends wired to AI</text><text x="1093.3333333333335" y="388" text-anchor="start" class="t" font-size="20" font-weight="400" fill="#CBD5E1">backends.</text><rect x="1093.3333333333335" y="460.0" width="88" height="32" rx="16.0" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-opacity=".40"/><text x="1108.3333333333335" y="481.6" class="t" font-size="16" font-weight="600" fill="#F59E0B">Next.js</text><rect x="1189.2533333333336" y="460.0" width="114" height="32" rx="16.0" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-opacity=".40"/><text x="1204.2533333333336" y="481.6" class="t" font-size="16" font-weight="600" fill="#F59E0B">TypeScript</text><rect x="1311.0933333333335" y="460.0" width="96" height="32" rx="16.0" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-opacity=".40"/><text x="1326.0933333333335" y="481.6" class="t" font-size="16" font-weight="600" fill="#F59E0B">Tailwind</text><rect x="1415.0133333333335" y="460.0" width="80" height="32" rx="16.0" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-opacity=".40"/><text x="1430.0133333333335" y="481.6" class="t" font-size="16" font-weight="600" fill="#F59E0B">Vercel</text></g></svg>